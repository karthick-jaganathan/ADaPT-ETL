[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-postgres"
version = "0.0.1"
description = "Adaptive Data Pipeline Toolkit - postgres connector (read-only SELECT queries on PostgreSQL, through DuckDB's postgres extension)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan"},
]
keywords = ["data", "pipeline", "etl", "postgres", "postgresql", "database", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
# DuckDB installs its postgres extension on the first connect (or ahead of time: INSTALL postgres)
dependencies = [
    "adapt-core~=0.0.1",
    "duckdb>=1.5",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/ADaPT-ETL"
Repository = "https://github.com/karthick-jaganathan/ADaPT-ETL"

[project.entry-points."adapt.connectors"]
postgres = "adapt.connectors.postgres.connector:PostgresConnector"

[tool.setuptools]
# src layout: adapt and adapt.connectors are namespace packages shared with the other ADaPT distributions
package-dir = {"" = "src"}
packages = ["adapt.connectors.postgres"]
