[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-meta-ads"
version = "0.1.0"
description = "StreamWright - Meta Ads connector (the meta_ads auth provider and Marketing API reads)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan"},
]
keywords = ["data", "pipeline", "etl", "connector", "meta-ads", "facebook-ads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "streamwright~=0.1.0",
    "facebook_business>=26.0",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/streamwright"
Repository = "https://github.com/karthick-jaganathan/streamwright"

[project.entry-points."streamwright.connectors"]
meta_ads = "streamwright.connectors.meta_ads.connector:MetaAdsConnector"

[tool.setuptools]
# src layout: streamwright and streamwright.connectors are namespace packages shared with the other StreamWright distributions
package-dir = {"" = "src"}
packages = ["streamwright.connectors.meta_ads"]
