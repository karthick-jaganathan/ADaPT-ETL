# Example source folder: this file, and one file per stream in streams/.
# Check it with: streamwright validate examples/sources/ads/openai_ads
# Run it (pip install streamwright-openai-ads): streamwright run examples/sources/ads/openai_ads --set account_ids=...
# Secrets come from STREAMWRIGHT_SECRET_<NAME> environment variables or --secrets FILE.
kind: source
name: openai_ads_demo
description: OpenAI Ads performance and metadata streams.

# Input specification: runtime configuration (visible) and secrets (redacted)
spec:
  config:
    account_ids: {type: list, items: string, description: Ad account IDs}
    start_date: {type: date, required: false, description: "The start date for performance metrics, e.g. 2026-01-01"}
  secrets:
    openai_ads_key: {type: string}

# Authentication: OpenAI Ads bearer token from secrets
auth:
  provider: openai_ads
  type: bearer
  token: "{{ secrets.openai_ads_key }}"

# HTTP defaults shared across all streams in this source
http:
  base_url: https://api.ads.openai.com
  # Default cursor paginator: advances using response.last_id -> request query param ?after=
  paginator: {type: cursor, token_path: last_id, param: after, has_more_path: has_more}
  # Default records path: extracts record list from the {"data": [...]} response envelope
  records: {path: data}
  # Automatic retries for rate limits (429) and server errors with exponential backoff
  retry: {codes: [429, 500, 502, 503, 504], max_attempts: 5, backoff: exponential, max_delay: 2m}
