[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-orchestration"
version = "0.1.0"
description = "Spec-driven Dagster orchestration for StreamWright: named declarative DAGs over the streamwright CLI."
requires-python = ">=3.10"
dependencies = ["dagster", "dagster-webserver", "duckdb", "pyyaml", "requests"]

[tool.dagster]
module_name = "streamwright.orchestration.definitions"
code_location_name = "streamwright"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["streamwright.orchestration", "streamwright.orchestration.runner"]
