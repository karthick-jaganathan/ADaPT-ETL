# Campaign groups of each sponsored ad account.
partitions:
  - {name: account_id, values: "{{ config.account_ids }}"}
retry: {max_attempts: 3, max_delay: 2m}

# HTTP request to list campaign groups for each ad account
requests:
  - name: raw_campaign_groups
    http:
      path: /rest/adCampaignGroups
      method: GET
      params:
        q: search
        search.account.values[0]: "urn:li:sponsoredAccount:{{ partition.account_id }}"

# Transform step: extracts campaign group attributes, budget amounts, and schedules
transform:
  mode: page
  steps:
    - name: campaign_groups
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               (record->>'id')::BIGINT                                  AS campaign_group_id,
               record->>'name'                                          AS campaign_group_name,
               record->>'status'                                        AS status,
               (record->>'$.totalBudget.amount')::DOUBLE                AS total_budget_amount,
               record->>'$.totalBudget.currencyCode'                    AS currency_code,
               to_timestamp(nullif(record->>'$.runSchedule.start', '')::BIGINT / 1000) AS start_time,
               to_timestamp(nullif(record->>'$.runSchedule.end', '')::BIGINT / 1000)   AS end_time,
               to_timestamp(nullif(record->>'$.changeAuditStamps.created.time', '')::BIGINT / 1000) AS created_at,
               to_timestamp(nullif(record->>'$.changeAuditStamps.lastModified.time', '')::BIGINT / 1000) AS updated_at
        FROM raw_campaign_groups

# Output table and primary key contract
export:
  campaign_groups:
    step: campaign_groups
    primary_key: [account_id, campaign_group_id]
