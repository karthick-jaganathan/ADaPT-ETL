# Ad groups of each ad account (account-level wider query).
# Note: OpenAI Ads API does not return parent campaign_id in account-level ad group listings.
# To extract ad groups with their parent campaign details, use the ad_group_tree stream.
partitions:
  - {name: account_id, values: "{{ config.account_ids }}"}
retry: {max_attempts: 3, max_delay: 2m}
requests:
  - name: ad_groups_list
    sdk: openai_ads
    service: ad_groups
    method: list
    arguments:
      params:
        ad_account_id: "{{ partition.account_id }}"
        limit: 500
transform:
  mode: page
  steps:
    - name: ad_groups
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               record->>'id'                                            AS ad_group_id,
               record->>'name'                                          AS ad_group_name,
               record->>'status'                                        AS status,
               record->>'$.bidding_config.strategy'                     AS bid_strategy,
               (record->>'$.bidding_config.max_bid_micros')::BIGINT     AS max_bid_micros,
               to_timestamp((record->>'created_at')::BIGINT)            AS created_at,
               to_timestamp((record->>'updated_at')::BIGINT)            AS updated_at
        FROM ad_groups_list
export:
  ad_groups:
    step: ad_groups
    primary_key: [ad_group_id]
