# The locations each campaign targets or excludes (negative): one call per campaign (from the campaigns stream).
partitions:
  - {from_stream: campaigns, fields: [account_id, campaign_id]}
requests:
  - name: raw_location_targets
    sdk: microsoft_ads
    service: CampaignManagementService
    method: GetCampaignCriterionsByIds      # without criterion IDs: all of the campaign's criteria of this type
    headers: {CustomerAccountId: "{{ partition.account_id }}"}
    arguments: {CampaignId: "{{ partition.campaign_id }}", CriterionType: Location}
    records: {path: CampaignCriterions.CampaignCriterion}   # two parts: CampaignCriterions and PartialErrors
transform:
  mode: page
  steps:
    - name: location_targets
      select: |
        SELECT partition->>'account_id'                       AS account_id,
               partition->>'campaign_id'                      AS campaign_id,
               record->>'Id'                                  AS criterion_id,
               record->>'$.Criterion.LocationId'              AS location_id,
               record->>'$.Criterion.DisplayName'             AS location_name,
               record->>'$.Criterion.LocationType'            AS location_type,   -- Country, State, City, PostalCode, ...
               record->>'Type'                                AS criterion_type,  -- Biddable or NegativeCampaignCriterion
               coalesce(criterion_type = 'NegativeCampaignCriterion', false) AS negative,
               (record->>'$.CriterionBid.Multiplier')::DOUBLE AS bid_multiplier,
               record->>'Status'                              AS status
        FROM raw_location_targets
export:
  location_targets:
    step: location_targets
    primary_key: [account_id, campaign_id, criterion_id]
