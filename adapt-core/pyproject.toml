[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-core"
version = "0.0.1"
description = "Adaptive Data Pipeline Toolkit - core runtime for `kind: source` configurations"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan"},
]
keywords = ["data", "pipeline", "etl", "connector", "singer", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.2",
    "requests>=2.25,<3",
    # `select`: the SQL that shapes each stream's records runs in an embedded DuckDB (which needs pytz for
    # timestamps with time zones)
    "duckdb>=1.5.2",
    "pytz",
]

[project.optional-dependencies]
# --output dlt:DESTINATION; also install the destination's extra, e.g. "dlt[duckdb]" or "dlt[bigquery]"
dlt = ["dlt>=1.0"]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/ADaPT-ETL"
Repository = "https://github.com/karthick-jaganathan/ADaPT-ETL"

[project.scripts]
# `adapt run`, `adapt validate`, `adapt connectors` - one CLI (see adapt.core.cli)
adapt = "adapt.core.cli:main"

[tool.setuptools]
# src layout: `adapt` is a namespace package shared with the connector distributions (adapt.connectors.*)
package-dir = {"" = "src"}
packages = [
    "adapt.core",
    "adapt.core.engine",
    "adapt.core.outputs",
    "adapt.core.net",
    "adapt.core.config",
    "adapt.core.validation",
    "adapt.core.runtime",
]
