# Networks: a network -> its ADaPT source folder and how to fill the inputs the source declares (spec.config and
# spec.secrets in its source.yaml). The framework knows nothing about any network: everything network specific is here.
#
#   source:      the source folder, relative to the repository root
#   timezone:    the default `adapt run --timezone` (an account row's `timezone` overrides it)
#   connectors:  the connectors the run may load (`--allow-connector`, so nothing else installed can be loaded)
#   image:       (optional) the container image a node's `adapt run` runs in when ADAPT_EXECUTION=docker or k8s; it must
#                have the network's connectors (adapt-pipeline:local: orchestration/docker/build.sh).
#                $ADAPT_IMAGE overrides it for every network. Ignored in the default subprocess mode.
#   inputs:      one value per declared input, a small template over
#                  {{ row.NAME }}  the account's lookup row (adapt/orchestration/accounts.py; a DB later)
#                  {{ app.NAME }}  app-level config/secrets (accounts.app_config(network))
#                  {{ ctx.NAME }}  user_id, account_id, network, timezone, schema
#                or a literal. A reference that is not set leaves the input unset (so the source's default applies;
#                an input the source requires with no value is an error). A value starting with `secret:` is a secret:
#                it is resolved at run time and passed to adapt as the ADAPT_SECRET_<NAME> environment variable -
#                never as --set, never in the run config, never logged. Every spec.secrets input is a secret anyway.
#   streams:     SHARED VOCABULARY. The pipelines use canonical node names; here each network maps every canonical node
#                to its own source stream name, or to `false` when the network has no such stream. So one pipeline runs
#                across networks that name (or lack) streams differently. A node mapped to a name must be a real stream
#                of the source; a node mapped `false` is skipped for that network (with explicit_false policy, only an
#                explicit false skips - an unmapped node is an error, so typos are caught). Define it for every node.
#   after:       (optional) per-network dependency override: a canonical node -> its upstream nodes, REPLACING the
#                pipeline's default edges for this network (some networks don't share the same parentage). A skipped
#                (false) upstream is dropped from a node's dependencies automatically.
#
# NO SECRET VALUES HERE: only references to where they come from.
networks:
  google_ads:
    source: examples/sources/ads/google_ads
    timezone: America/New_York
    connectors: [google_ads, gaql]          # the SDK connector and its GAQL query builder
    image: adapt-pipeline:local             # ADAPT_EXECUTION=docker: adapt + the ad connectors (pipeline/docker/)
    inputs:
      customer_ids:      "{{ row.account_id }}"
      login_customer_id: "{{ row.login_customer_id }}"   # the manager account, when the row has one
      start_date:        "-7d"
      developer_token:   "secret:{{ app.developer_token }}"
      client_id:         "secret:{{ app.client_id }}"
      client_secret:     "secret:{{ app.client_secret }}"
      refresh_token:     "secret:{{ app.refresh_token }}"   # production: the user's token from the DB row
    streams:                                # google_ads names every canonical node the same (identity)
      campaigns:           campaigns
      ad_groups:           ad_groups
      ad_group_hierarchy:  ad_group_hierarchy
      location_targets:    location_targets
      keywords:            keywords
      audience_targets:    audience_targets
      campaign_performance: campaign_performance

  microsoft_ads:
    source: examples/sources/ads/microsoft_ads
    timezone: America/New_York
    connectors: [microsoft_ads]
    image: adapt-pipeline:local
    inputs:
      account_ids:     "{{ row.account_id }}"
      customer_id:     "{{ row.customer_id }}"             # the manager (customer) the accounts live under
      start_date:      "-7d"
      developer_token: "secret:{{ app.developer_token }}"
      client_id:       "secret:{{ app.client_id }}"
      client_secret:   "secret:{{ app.client_secret }}"   # optional (web apps only); unset leaves it to the source
      refresh_token:   "secret:{{ app.refresh_token }}"
    streams:                                # microsoft names the hierarchy stream differently (an alias)
      campaigns:           campaigns
      ad_groups:           ad_groups
      ad_group_hierarchy:  ad_group_tree    # same concept, different name on microsoft
      location_targets:    location_targets
      keywords:            keywords
      audience_targets:    audience_targets
      campaign_performance: campaign_performance

  facebook_ads:
    source: examples/sources/ads/facebook_ads
    timezone: America/New_York
    connectors: [facebook_ads]
    image: adapt-pipeline:local
    inputs:
      account_ids:  "{{ row.account_id }}"                 # the ad account id, without the act_ prefix
      start_date:   "-7d"
      access_token: "secret:{{ app.access_token }}"
      app_id:       "secret:{{ app.app_id }}"              # optional
      app_secret:   "secret:{{ app.app_secret }}"          # optional
    streams:                                # facebook aliases two streams and has none for the targeting nodes
      campaigns:           campaigns
      ad_groups:           ad_sets          # facebook's ad sets are the ad-group tier
      ad_group_hierarchy:  false            # facebook has no such stream
      location_targets:    false
      keywords:            false
      audience_targets:    false
      campaign_performance: campaign_insights
    after:                                  # facebook ad sets are fetched per account, independently of campaigns
      ad_groups: []
