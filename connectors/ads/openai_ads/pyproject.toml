[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-openai-ads"
version = "0.1.0"
description = "StreamWright - OpenAI Ads connector"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "StreamWright"}
]
keywords = ["data", "pipeline", "etl", "connector", "openai-ads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "streamwright~=0.1.0",
    "requests>=2.28.0",
]

[project.entry-points."streamwright.connectors"]
openai_ads = "streamwright.connectors.openai_ads.connector:OpenAIAdsConnector"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["streamwright.connectors.openai_ads"]
