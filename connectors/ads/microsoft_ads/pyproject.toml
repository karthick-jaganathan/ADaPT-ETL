[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-microsoft-ads"
version = "0.0.1"
description = "Adaptive Data Pipeline Toolkit - Microsoft Advertising connector (the microsoft_ads auth provider, SOAP requests and reports)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan"},
]
keywords = ["data", "pipeline", "etl", "connector", "microsoft-ads", "bing-ads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "adapt-core~=0.0.1",
    "bingads~=13.0",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/ADaPT-ETL"
Repository = "https://github.com/karthick-jaganathan/ADaPT-ETL"

[project.entry-points."adapt.connectors"]
microsoft_ads = "adapt.connectors.microsoft_ads.connector:MicrosoftAdsConnector"

[tool.setuptools]
# src layout: adapt and adapt.connectors are namespace packages shared with the other ADaPT distributions
package-dir = {"" = "src"}
packages = ["adapt.connectors.microsoft_ads"]
