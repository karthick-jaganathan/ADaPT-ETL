[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-gcs"
version = "0.0.1"
description = "Adaptive Data Pipeline Toolkit - gcs connector (csv, tsv, json, jsonl and parquet objects in Google Cloud Storage, read with DuckDB)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan"},
]
keywords = ["data", "pipeline", "etl", "gcs", "google cloud storage", "object storage", "csv", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
# DuckDB installs its httpfs extension on the first connect (or ahead of time: INSTALL httpfs)
dependencies = [
    "adapt-core~=0.0.1",
    "duckdb>=1.5",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/ADaPT-ETL"
Repository = "https://github.com/karthick-jaganathan/ADaPT-ETL"

[project.entry-points."adapt.connectors"]
gcs = "adapt.connectors.gcs.connector:GcsConnector"

[tool.setuptools]
# src layout: adapt and adapt.connectors are namespace packages shared with the other ADaPT distributions
package-dir = {"" = "src"}
packages = ["adapt.connectors.gcs"]
