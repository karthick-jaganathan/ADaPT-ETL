[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-deltalake"
version = "0.1.0"
description = "StreamWright - Delta Lake connector (read-only queries and scans on Delta tables through DuckDB's delta extension)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "deltalake", "delta-lake", "lakehouse", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
# DuckDB is provided by streamwright (duckdb>=1.5.2)
dependencies = [
    "streamwright~=0.1.0",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/streamwright"
Repository = "https://github.com/karthick-jaganathan/streamwright"

[project.entry-points."streamwright.connectors"]
deltalake = "streamwright.connectors.deltalake.connector:DeltaLakeConnector"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["streamwright.connectors.deltalake"]
