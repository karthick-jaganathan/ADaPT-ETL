# Ad accounts available to the authenticated advertiser.
retry: {max_attempts: 3, max_delay: 2m}

# HTTP request to list ad accounts (inherits base_url, paginator, records from source.yaml)
requests:
  - name: raw_ad_accounts
    records:
      path: elements
    http:
      path: /rest/adAccounts
      method: GET
      params:
        q: search

# Transform step: extracts account fields and converts millisecond timestamps
transform:
  mode: page
  steps:
    - name: ad_accounts
      select: |
        SELECT (record->>'id')::BIGINT                                  AS account_id,
               record->>'name'                                          AS account_name,
               record->>'status'                                        AS status,
               record->>'type'                                          AS account_type,
               record->>'currency'                                      AS currency_code,
               record->>'reference'                                     AS organization_urn,
               to_timestamp(nullif(record->>'$.changeAuditStamps.created.time', '')::BIGINT / 1000) AS created_at,
               to_timestamp(nullif(record->>'$.changeAuditStamps.lastModified.time', '')::BIGINT / 1000) AS updated_at
        FROM raw_ad_accounts

# Output table and primary key contract
export:
  ad_accounts:
    step: ad_accounts
    primary_key: [account_id]
