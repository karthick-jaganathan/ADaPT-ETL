# Campaign performance metrics (delivery insights) per campaign per day.
partitions:
  - {name: account_id, values: "{{ config.account_ids }}"}
incremental:
  cursor_field: date
  start: "{{ config.start_date }}"
  window: 1d
retry: {max_attempts: 3, max_delay: 2m}

# HTTP requests: list campaigns, then request delivery insights for each campaign within the date window
requests:
  - name: raw_campaigns
    http:
      path: /v1/campaigns
      method: GET
      params:
        ad_account_id: "{{ partition.account_id }}"
        limit: 500
  - name: raw_campaign_insights
    partitions:
      - {from: campaign_rows, fields: [account_id, campaign_id]}
    http:
      path: "/v1/campaigns/{{ partition.campaign_id }}/insights"
      method: GET
      params:
        start_date: "{{ window.start }}"
        end_date: "{{ window.end }}"
        limit: 500

# Transform step: unpack daily metrics and join with campaign metadata
transform:
  mode: run
  steps:
    - name: campaign_rows
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               record->>'id'                                            AS campaign_id,
               record->>'name'                                          AS campaign_name
        FROM raw_campaigns
    - name: insight_rows
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               partition->>'campaign_id'                                AS campaign_id,
               (record->>'date')::DATE                                  AS date,
               coalesce((record->>'impressions')::BIGINT, 0)            AS impressions,
               coalesce((record->>'clicks')::BIGINT, 0)                 AS clicks,
               coalesce((record->>'spend')::DOUBLE, 0)                  AS spend,
               round(coalesce((record->>'spend')::DOUBLE, 0) / nullif((record->>'clicks')::BIGINT, 0), 4) AS cpc
        FROM raw_campaign_insights
    - name: campaign_performance
      select: |
        SELECT i.account_id,
               i.campaign_id,
               c.campaign_name,
               i.date,
               i.impressions,
               i.clicks,
               i.spend,
               i.cpc
        FROM insight_rows i
        LEFT JOIN campaign_rows c USING (account_id, campaign_id)
# Output table and primary key contract
export:
  campaign_performance:
    step: campaign_performance
    primary_key: [account_id, campaign_id, date]
