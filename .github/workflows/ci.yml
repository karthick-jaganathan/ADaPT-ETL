name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and config validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No vendor SDKs here: the core must work without them (the connector tests skip; see the connectors job).
      - name: Install ADaPT
        run: python -m pip install ./adapt-core pytest jsonschema

      - name: Run tests
        run: make test

      - name: Validate example configs
        run: adapt validate --strict --format github examples

  connectors:
    name: Connectors and dlt (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The connectors install their vendor SDKs (files, s3, gcs, postgres: DuckDB), and dlt loads into DuckDB; the tests
      # still never call external APIs (s3 and gcs read a local stand-in for object storage, postgres a local DuckDB
      # stand-in).
      - name: Install ADaPT, connectors and dlt
        run: python -m pip install ./adapt-core ./connectors/ads/google_ads ./connectors/ads/microsoft_ads ./connectors/ads/facebook_ads ./connectors/readers/files ./connectors/readers/s3 ./connectors/readers/gcs ./connectors/readers/postgres pytest jsonschema "dlt[duckdb]>=1.0"

      - name: Check the connectors are registered
        run: |
          out="$(adapt connectors)"; echo "$out"
          for c in files s3 gcs postgres google_ads microsoft_ads facebook_ads; do
            echo "$out" | grep -qE "^  $c( |\$)" || { echo "missing connector: $c"; exit 1; }
          done

      - name: Run tests
        run: make test
