[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-s3"
version = "0.1.0"
description = "StreamWright - s3 connector (csv, tsv, json, jsonl and parquet objects in Amazon S3 or an S3-compatible store, read with DuckDB)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan"},
]
keywords = ["data", "pipeline", "etl", "s3", "object storage", "csv", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
# DuckDB installs its httpfs extension on the first connect (or ahead of time: INSTALL httpfs)
dependencies = [
    "streamwright~=0.1.0",
    "duckdb>=1.5",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/streamwright"
Repository = "https://github.com/karthick-jaganathan/streamwright"

[project.entry-points."streamwright.connectors"]
s3 = "streamwright.connectors.s3.connector:S3Connector"

[tool.setuptools]
# src layout: streamwright and streamwright.connectors are namespace packages shared with the other StreamWright distributions
package-dir = {"" = "src"}
packages = ["streamwright.connectors.s3"]
