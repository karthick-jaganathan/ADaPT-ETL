# Campaign performance metrics (delivery analytics) per campaign per day.
partitions:
  - {name: account_id, values: "{{ config.account_ids }}"}
incremental:
  cursor_field: date
  start: "{{ config.start_date }}"
  window: 1d
retry: {max_attempts: 3, max_delay: 2m}

# HTTP request for ad analytics pivoted by campaign and daily granularity
requests:
  - name: raw_campaign_performance
    http:
      path: /rest/adAnalytics
      method: GET
      params:
        q: analytics
        pivot: CAMPAIGN
        timeGranularity: DAILY
        accounts:
          - "urn:li:sponsoredAccount:{{ partition.account_id }}"
        dateRange:
          start:
            year: "{{ window.start | date('%Y') | int }}"
            month: "{{ window.start | date('%m') | int }}"
            day: "{{ window.start | date('%d') | int }}"
          end:
            year: "{{ window.end | date('%Y') | int }}"
            month: "{{ window.end | date('%m') | int }}"
            day: "{{ window.end | date('%d') | int }}"

# Transform step: unpacks impressions, clicks, spend, cpc, conversions, and leads
transform:
  mode: page
  steps:
    - name: campaign_performance
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               split_part(record->>'pivotValue', ':', 4)::BIGINT        AS campaign_id,
               make_date(
                 (record->>'$.dateRange.start.year')::INT,
                 (record->>'$.dateRange.start.month')::INT,
                 (record->>'$.dateRange.start.day')::INT
               )                                                        AS date,
               coalesce((record->>'impressions')::BIGINT, 0)            AS impressions,
               coalesce((record->>'clicks')::BIGINT, 0)                 AS clicks,
               coalesce((record->>'costInUsd')::DOUBLE, 0)              AS spend,
               round(
                 coalesce((record->>'costInUsd')::DOUBLE, 0) /
                 nullif((record->>'clicks')::BIGINT, 0),
                 4
               )                                                        AS cpc,
               coalesce((record->>'externalWebsiteConversions')::BIGINT, 0) AS conversions,
               coalesce((record->>'oneClickLeads')::BIGINT, 0)          AS leads
        FROM raw_campaign_performance

# Output table and primary key contract
export:
  campaign_performance:
    step: campaign_performance
    primary_key: [account_id, campaign_id, date]
