[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-microsoft-ads"
version = "0.1.0"
description = "StreamWright - Microsoft Advertising connector (the microsoft_ads auth provider, SOAP requests and reports)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "connector", "microsoft-ads", "bing-ads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "streamwright~=0.1.0",
    "bingads~=13.0",
]

[project.urls]
Homepage = "https://github.com/karthick-jaganathan/streamwright"
Repository = "https://github.com/karthick-jaganathan/streamwright"

[project.entry-points."streamwright.connectors"]
microsoft_ads = "streamwright.connectors.microsoft_ads.connector:MicrosoftAdsConnector"

[tool.setuptools]
# src layout: streamwright and streamwright.connectors are namespace packages shared with the other StreamWright distributions
package-dir = {"" = "src"}
packages = ["streamwright.connectors.microsoft_ads"]
