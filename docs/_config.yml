# Site settings
title: "StreamWright"
description: "A Python-based, YAML-configured data pipeline framework for extracting, transforming, and exporting data from various sources to multiple destinations."
baseurl: "/streamwright"
url: "https://karthick-jaganathan.github.io"

# Logo and favicon
logo: "/assets/images/streamwright-logo.png"
# favicon_ico: "/assets/images/favicon.ico"

# Repository information
repository: "karthick-jaganathan/streamwright"

# Build settings
markdown: kramdown
highlighter: rouge
remote_theme: just-the-docs/just-the-docs

# Mermaid diagrams (architecture + sequence diagrams in docs/architecture.md)
mermaid:
  version: "10.9.1"
  # Passed to mermaid.initialize() by _includes/mermaid_config.js.
  # darkThemeVariables are merged over themeVariables in the streamwright-dark scheme.
  theme: base
  themeVariables:
    fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    fontSize: "16px"
    primaryColor: "#ede7f6"
    primaryBorderColor: "#5e41d0"
    primaryTextColor: "#311b70"
    secondaryColor: "#f3e5f5"
    secondaryBorderColor: "#9575cd"
    tertiaryColor: "#f8f9fa"
    tertiaryBorderColor: "#d5dbdb"
    lineColor: "#5e41d0"
    noteBkgColor: "#ede7f6"
    noteBorderColor: "#9575cd"
    noteTextColor: "#311b70"
    textColor: "#34495e"
  flowchart:
    htmlLabels: true
    curve: basis
    nodeSpacing: 55
    rankSpacing: 65
    padding: 10
  sequence:
    actorFontSize: 15
    messageFontSize: 14
    noteFontSize: 14
    boxMargin: 10
    width: 150
  darkThemeVariables:
    darkMode: true
    fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    fontSize: "16px"
    background: "#161d27"
    primaryColor: "#2a1f45"
    primaryBorderColor: "#b39ddb"
    primaryTextColor: "#e6edf3"
    secondaryColor: "#241a3d"
    secondaryBorderColor: "#8bc34a"
    tertiaryColor: "#1b2430"
    tertiaryBorderColor: "#2a3441"
    lineColor: "#b39ddb"
    noteBkgColor: "#241a3d"
    noteBorderColor: "#9575cd"
    noteTextColor: "#e6edf3"
    textColor: "#c9d1d9"

# Kramdown settings
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# Navigation
header_pages:
  - index.md
  - installation.md
  - architecture.md
  - packages/index.md
  - examples.md
  - api-reference.md
  - contributing.md

# Collections
collections:
  packages:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "packages"
    values:
      layout: "package"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/



# SEO settings
author: "Karthick Jaganathan"
twitter:
  username: kjaganathan
  card: summary

# Social links
github_username: karthick-jaganathan

# Google Analytics (optional)
# google_analytics: UA-XXXXXXXX-X

# Just the Docs theme configuration
color_scheme: streamwright
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Enable copy code button
enable_copy_code_button: true

# Aux links for header
aux_links:
  "GitHub Repository":
    - "https://github.com/karthick-jaganathan/streamwright"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Footer content
footer_content: "Copyright &copy; 2024 StreamWright Project. Distributed under the <a href=\"https://github.com/karthick-jaganathan/streamwright/blob/master/LICENSE\">Apache License 2.0</a>."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red 