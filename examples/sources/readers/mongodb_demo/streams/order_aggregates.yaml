description: MongoDB aggregation pipeline stream for order totals by category.

requests:
  - name: raw_order_aggregates
    service: database
    method: aggregate
    sdk: mongodb
    arguments:
      collection: orders
      pipeline:
        - $match:
            status: completed
        - $group:
            _id: "$category"
            total_amount:
              $sum: "$amount"
            order_count:
              $sum: 1

transform:
  mode: page
  steps:
    - name: order_aggregates
      select: |
        SELECT
          record->>'_id'                                      AS category,
          (record->>'total_amount')::DOUBLE                   AS total_amount,
          (record->>'order_count')::BIGINT                    AS order_count
        FROM raw_order_aggregates

export:
  order_aggregates:
    step: order_aggregates
    primary_key: [category]
