# Ad performance metrics (delivery insights) per ad per day.
partitions:
  - {name: account_id, values: "{{ config.account_ids }}"}
incremental:
  cursor_field: date
  start: "{{ config.start_date }}"
  window: 1d
retry: {max_attempts: 3, max_delay: 2m}

# HTTP requests: list ads, then request delivery insights for each ad within the date window
requests:
  - name: raw_ads
    http:
      path: /v1/ads
      method: GET
      params:
        ad_account_id: "{{ partition.account_id }}"
        limit: 500
  - name: raw_ad_insights
    partitions:
      - {from: ad_rows, fields: [account_id, ad_id]}
    http:
      path: "/v1/ads/{{ partition.ad_id }}/insights"
      method: GET
      params:
        start_date: "{{ window.start }}"
        end_date: "{{ window.end }}"
        limit: 500

# Transform step: unpack daily metrics and join with ad metadata
transform:
  mode: run
  steps:
    - name: ad_rows
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               record->>'id'                                            AS ad_id,
               record->>'name'                                          AS ad_name
        FROM raw_ads
    - name: insight_rows
      select: |
        SELECT partition->>'account_id'                                 AS account_id,
               partition->>'ad_id'                                      AS ad_id,
               (record->>'date')::DATE                                  AS date,
               coalesce((record->>'impressions')::BIGINT, 0)            AS impressions,
               coalesce((record->>'clicks')::BIGINT, 0)                 AS clicks,
               coalesce((record->>'spend')::DOUBLE, 0)                  AS spend,
               round(coalesce((record->>'spend')::DOUBLE, 0) / nullif((record->>'clicks')::BIGINT, 0), 4) AS cpc
        FROM raw_ad_insights
    - name: ad_performance
      select: |
        SELECT i.account_id,
               i.ad_id,
               a.ad_name,
               i.date,
               i.impressions,
               i.clicks,
               i.spend,
               i.cpc
        FROM insight_rows i
        LEFT JOIN ad_rows a USING (account_id, ad_id)
# Output table and primary key contract
export:
  ad_performance:
    step: ad_performance
    primary_key: [account_id, ad_id, date]
