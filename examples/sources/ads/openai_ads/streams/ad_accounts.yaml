# Ad accounts available to the authenticated advertiser.
retry: {max_attempts: 3, max_delay: 2m}

# HTTP request to list ad accounts (inherits base_url, paginator, records from source.yaml)
requests:
  - name: raw_ad_accounts
    http:
      path: /v1/ad_accounts
      method: GET
      params:
        limit: 500

# Transform step: extracts fields from raw JSON records and normalizes column names
transform:
  mode: page
  steps:
    - name: ad_accounts
      select: |
        SELECT record->>'id'                                            AS account_id,
               record->>'name'                                          AS account_name,
               record->>'status'                                        AS status,
               record->>'currency_code'                                 AS currency_code,
               record->>'timezone'                                      AS timezone,
               record->>'url'                                           AS website_url
        FROM raw_ad_accounts

# Output table and primary key contract
export:
  ad_accounts:
    step: ad_accounts
    primary_key: [account_id]
