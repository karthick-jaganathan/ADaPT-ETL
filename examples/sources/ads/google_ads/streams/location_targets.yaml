# The locations each campaign targets or excludes (negative), as geo target constants (geoTargetConstants/<id>).
partitions:
  - {name: customer_id, values: "{{ config.customer_ids }}"}
requests:
  - name: raw_location_targets
    sdk: google_ads
    service: GoogleAdsService
    method: search_stream
    arguments:
      customer_id: "{{ partition.customer_id }}"
      query:
        gaql:
          select: [customer.id, campaign.id, campaign_criterion.criterion_id,
                   campaign_criterion.location.geo_target_constant, campaign_criterion.negative,
                   campaign_criterion.bid_modifier, campaign_criterion.status]
          from: campaign_criterion
          where:
            - {field: campaign_criterion.type, op: "=", type: enum, value: LOCATION}
            - {field: campaign.status, op: IN, type: enum, value: [ENABLED, PAUSED]}
transform:
  mode: page
  steps:
    - name: location_targets
      select: |
        SELECT record->>'$.customer.id'                                     AS customer_id,
               record->>'$.campaign.id'                                     AS campaign_id,
               record->>'$.campaign_criterion.criterion_id'                 AS criterion_id,
               record->>'$.campaign_criterion.location.geo_target_constant' AS geo_target_constant,
               coalesce((record->>'$.campaign_criterion.negative')::BOOLEAN, false) AS negative,
               (record->>'$.campaign_criterion.bid_modifier')::DOUBLE       AS bid_modifier,
               CASE record->>'$.campaign_criterion.status' WHEN 'ENABLED' THEN 'active' WHEN 'PAUSED' THEN 'paused'
                    WHEN 'REMOVED' THEN 'removed' END AS status
        FROM raw_location_targets
export:
  location_targets:
    step: location_targets
    primary_key: [customer_id, campaign_id, criterion_id]
