# App-level API credentials per network (and optional region) — the secrets provider.
# Copy to ~/.streamwright/secrets.yaml (dev/testing) or serve the same document from STREAMWRIGHT_SECRETS_URL (production).
#
#   secrets.<network>.default          base values for the network
#   secrets.<network>.regions.<region> overlaid on default when an account's region matches (STREAMWRIGHT_REGION overrides)
#
# NO tokens here — a run's OAuth token comes from the account (accounts.yaml `token`), never from this file.
version: "1"
secrets:
  google_ads:
    default:
      developer_token: REPLACE_ME_GOOGLE_DEVELOPER_TOKEN
      client_id: REPLACE_ME_GOOGLE_CLIENT_ID
      client_secret: REPLACE_ME_GOOGLE_CLIENT_SECRET
    regions:
      eu-west-1:
        developer_token: REPLACE_ME_GOOGLE_DEVELOPER_TOKEN_EU
  microsoft_ads:
    default:
      developer_token: REPLACE_ME_MICROSOFT_DEVELOPER_TOKEN
      client_id: REPLACE_ME_MICROSOFT_CLIENT_ID
      client_secret: REPLACE_ME_MICROSOFT_CLIENT_SECRET
  meta_ads:
    default:
      app_id: REPLACE_ME_META_APP_ID
      app_secret: REPLACE_ME_META_APP_SECRET
