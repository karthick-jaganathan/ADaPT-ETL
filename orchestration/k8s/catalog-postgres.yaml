# The DuckLake catalog of the simulation: Postgres at catalog-postgres.adapt.svc.cluster.local:5432, database adaptcat,
# user adapt. Each user's catalog tables are in a schema of their own (lake_<user>, ADAPT_DUCKLAKE_CATALOG_SCHEMA).
# The password is NOT here: setup.sh generates it into the Secret catalog-postgres-auth (POSTGRES_PASSWORD) and the
# same value into adapt-secrets (ADAPT_DUCKLAKE_CATALOG_PASSWORD) for the Jobs. The data is on an emptyDir (a
# simulation): deleting the pod drops the catalog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-postgres
  namespace: adapt
  labels:
    app.kubernetes.io/name: catalog-postgres
    app.kubernetes.io/part-of: adapt-pipeline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-postgres
        app.kubernetes.io/part-of: adapt-pipeline
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: adaptcat
            - name: POSTGRES_USER
              value: adapt
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "adapt", "-d", "adaptcat"]
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-postgres
  namespace: adapt
  labels:
    app.kubernetes.io/name: catalog-postgres
    app.kubernetes.io/part-of: adapt-pipeline
spec:
  selector:
    app.kubernetes.io/name: catalog-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
