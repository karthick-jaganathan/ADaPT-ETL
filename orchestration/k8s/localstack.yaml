# The object store of the simulation: LocalStack's S3 at localstack.streamwright.svc.cluster.local:4566 (path-style, no TLS).
# The DuckLake data files (Parquet) of user <u> go to s3://streamwright-warehouse/<u>/. A ready hook makes the bucket; setup.sh
# checks it too. LocalStack keeps its data in memory: deleting the pod empties the bucket (it is a simulation).
# Credentials: LocalStack accepts any; the Jobs get test/test from the streamwright-secrets Secret (made by setup.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: streamwright
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: streamwright-pipeline
data:
  create-bucket.sh: |
    #!/bin/sh
    awslocal s3api head-bucket --bucket streamwright-warehouse >/dev/null 2>&1 || awslocal s3 mb s3://streamwright-warehouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: streamwright
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: streamwright-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/part-of: streamwright-pipeline
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICES
              value: s3
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports:
            - name: edge
              containerPort: 4566
          readinessProbe:      # ready once the ready hook made the bucket
            exec:
              command: ["sh", "-c", "awslocal s3api head-bucket --bucket streamwright-warehouse"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: init
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: streamwright
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: streamwright-pipeline
spec:
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
